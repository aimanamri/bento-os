# Bento OS — API gateway for the self-hosted Supabase stack.
#
# supabase-js expects ONE origin that serves all three APIs under fixed
# prefixes, exactly as the hosted product does. This is the container that
# provides it (the hosted equivalent is Kong):
#
#   http://localhost:8000/auth/v1/...       →  auth  (GoTrue)      :9999
#   http://localhost:8000/rest/v1/...       →  rest  (PostgREST)   :3000
#   http://localhost:8000/functions/v1/...  →  functions (Deno)    :9000
#
# The trailing slash on each proxy_pass strips the /xxx/v1 prefix before
# forwarding, which is what the upstreams expect.
#
# Nothing here authenticates: every upstream validates the HS256 JWT itself
# against the shared JWT_SECRET, and PostgREST turns the `role` claim into a
# real Postgres role so the RLS policies in supabase/migrations/ do the actual
# authorisation. The gateway only routes and handles CORS.

server {
    listen 8000;
    server_name _;

    # Uploads/edits can be large-ish markdown documents; the default 1m is
    # tight for a LogBook entry with embedded base64 images.
    client_max_body_size 10m;

    # ---- CORS ----------------------------------------------------------
    # The app is served from :8481 and the API from :8000 — different ports,
    # so every request is cross-origin and needs these headers.
    #
    # The origin is reflected rather than pinned because the app port is
    # configurable (BENTO_HOST_PORT). That is safe here specifically because
    # this API carries NO ambient credentials: supabase-js authenticates with
    # an `Authorization: Bearer` header it must add deliberately, there is no
    # session cookie, and Access-Control-Allow-Credentials is never sent — so
    # a hostile page cannot make an authenticated request on your behalf. The
    # gateway is also published on loopback only.
    #
    # Upstream CORS headers are hidden first: GoTrue and PostgREST emit their
    # own, and two Access-Control-Allow-Origin values make the browser reject
    # the response outright.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;

    # Allow-Headers REFLECTS what the browser asked for rather than naming a
    # fixed list. A hard-coded list is a standing trap: supabase-js sends
    # headers this file cannot know about — `x-supabase-api-version` today,
    # something else after the next SDK bump — and any header missing from the
    # list makes the browser abort with a bare `TypeError: Failed to fetch`
    # while nginx logs a perfectly healthy 204. The failure is invisible
    # server-side, and curl will not reproduce it unless you happen to send the
    # exact same header set the SDK does.
    #
    # Reflecting is safe here for the same reason the origin is reflected: this
    # API carries no ambient credentials (no cookies, no Allow-Credentials), so
    # CORS is not what protects it — the JWT and the RLS policies behind it are.
    #
    # On a non-preflight request the variable is empty and the header is simply
    # not added, which is correct: Allow-Headers only has meaning on a preflight.
    #
    # These sit at server level, NOT inside the `if` below: nginx permits
    # add_header in an `if` only within a location, never within a server.
    add_header Access-Control-Allow-Origin   $http_origin always;
    add_header Access-Control-Allow-Methods  "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers  $http_access_control_request_headers always;
    add_header Access-Control-Expose-Headers "content-range, content-profile" always;
    add_header Access-Control-Max-Age        3600 always;

    # Answer preflight here so it never reaches an upstream.
    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- GoTrue: sign-in, sign-up, token refresh, admin user CRUD -------
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
    }

    # ---- PostgREST: every sb.from(...) and sb.rpc(...) call -------------
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
    }

    # ---- Edge Functions: admin-create-user, delete-account, ... ---------
    location /functions/v1/ {
        proxy_pass http://functions:9000/;
        # Cold-starting a Deno worker can take a few seconds on first hit.
        proxy_read_timeout 150s;
    }

    # Liveness probe for the compose healthcheck.
    location = /gateway-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404 '{"error":"no such API prefix; expected /auth/v1, /rest/v1 or /functions/v1"}';
        add_header Content-Type application/json always;
    }
}
